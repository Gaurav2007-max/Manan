<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manan — Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:420px;margin:8vh auto;padding:28px;background:#071124;border-radius:12px;color:#e6eef8">
    <h2 style="margin:0 0 12px">Sign in to Manan</h2>
    <label>Email</label><input id="liEmail" type="email" />
    <label style="margin-top:8px">Password</label><input id="liPass" type="password" />
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="liSignIn" class="btn">Sign in</button>
    </div>
    <div id="liMsg" style="margin-top:12px;color:var(--muted)"></div>
  </main>

  <script type="module" src="auth-login.js"></script>
</body>
</html>
