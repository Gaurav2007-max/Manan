<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Manan — Sign in</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Center the login box using same theme */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:#f5f7fa;
      margin:0;
      font-family: Inter, system-ui, Arial;
      color:#1e293b;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    .login-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .login-card h2 {
      margin: 0 0 12px;
      font-weight: 700;
    }

    #liMsg, #suMsg {
      margin-top: 12px;
      color: var(--muted);
    }
  </style>

</head>
<body>

  <main class="login-card">
    
    <h2>Manan Portal</h2>

    <!-- Toggle buttons -->
    <div class="login-toggle">
      <button id="showLogin" class="btn-gradient" style="flex:1">Login</button>
      <button id="showSignup" class="btn-gradient" style="flex:1">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <label>Email</label>
      <input id="liEmail" type="email" />

      <label>Password</label>
      <input id="liPass" type="password" />

      <div class="login-toggle" style="margin-top:12px">
        <button id="liSignIn" class="btn logo" style="flex:1">Sign in</button>
      </div>

      <div id="liMsg"></div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none">

      <label>Full Name</label>
      <input id="suName" type="text">

      <label>College Email</label>
      <input id="suEmail" type="email">

      <label>Password</label>
      <input id="suPass" type="password">

      <label>Year</label>
      <input id="suYear" type="text" placeholder="e.g. 2nd">

      <label>Roll No</label>
      <input id="suRoll" type="text">

      <label>Branch</label>
      <input id="suBranch" type="text">

      <div class="login-toggle" style="margin-top:12px">
        <button id="doSignUp" class="btn logo" style="flex:1">Request Sign Up</button>
      </div>

      <div id="suMsg"></div>
    </div>

  </main>

  <script type="module" src="auth-login.js"></script>

  <script>
    // Toggle login/signup
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const btnLogin = document.getElementById("showLogin");
    const btnSignup = document.getElementById("showSignup");

    btnSignup.addEventListener("click", () => {
      loginForm.style.display = "none";
      signupForm.style.display = "block";
    });

    btnLogin.addEventListener("click", () => {
      signupForm.style.display = "none";
      loginForm.style.display = "block";
    });
  </script>

</body>
</html>
