name: Manan AI

on:
  repository_dispatch:
    types: [ask_ai]

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        env:
          TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          curl https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {
                  "role": "system",
                  "content": "You are Manan AI Helper. Manan is a technical club of JC Bose University. Answer questions about Manan, joining, events."
                },
                {
                  "role": "user",
                  "content": "'"${{ github.event.client_payload.question }}"'"
                }
              ]
            }'
